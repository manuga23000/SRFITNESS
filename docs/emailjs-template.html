<div style="margin:0;padding:24px 12px;background:#f2f2f4;font-family:Arial,Helvetica,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;margin:0 auto;background:#ffffff;border-radius:16px;overflow:hidden;">
    <tr>
      <td style="background:#0a0a0b;padding:22px 24px;">
        <table role="presentation" cellpadding="0" cellspacing="0">
          <tr>
            <td style="background:#c6ff00;border-radius:10px;width:44px;height:44px;text-align:center;font-weight:bold;font-size:18px;color:#0a0a0b;">SR</td>
            <td style="padding-left:12px;">
              <div style="color:#ffffff;font-size:18px;font-weight:bold;letter-spacing:1px;">SR FITNESS</div>
              <div style="color:#c6ff00;font-size:11px;font-weight:bold;letter-spacing:4px;">GYM</div>
            </td>
          </tr>
        </table>
      </td>
    </tr>
    <tr>
      <td style="padding:28px 24px 8px;">
        <div style="font-size:22px;font-weight:bold;color:#0a0a0b;">{{titulo}}</div>
        <p style="margin:14px 0 0;font-size:15px;line-height:1.55;color:#33333a;">Hola {{to_name}}!</p>
        <p style="margin:8px 0 0;font-size:15px;line-height:1.55;color:#33333a;">{{mensaje}}</p>
      </td>
    </tr>
    <tr>
      <td style="padding:18px 24px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f6f6f8;border-radius:12px;">
          <tr>
            <td style="padding:14px 16px;font-size:12px;color:#6e6e78;text-transform:uppercase;letter-spacing:1px;">Vencimiento</td>
            <td style="padding:14px 16px;font-size:15px;font-weight:bold;color:#0a0a0b;text-align:right;">{{fecha_vencimiento}}</td>
          </tr>
          <tr>
            <td style="padding:0 16px 14px;font-size:12px;color:#6e6e78;text-transform:uppercase;letter-spacing:1px;">Plan</td>
            <td style="padding:0 16px 14px;font-size:15px;font-weight:bold;color:#0a0a0b;text-align:right;">{{plan}}</td>
          </tr>
          <tr>
            <td style="padding:0 16px 14px;font-size:12px;color:#6e6e78;text-transform:uppercase;letter-spacing:1px;">Cuota</td>
            <td style="padding:0 16px 14px;font-size:15px;font-weight:bold;color:#0a0a0b;text-align:right;">{{monto}}</td>
          </tr>
        </table>
      </td>
    </tr>
    <tr>
      <td style="padding:4px 24px 28px;font-size:15px;color:#33333a;">¡Te esperamos! 💪<br /><strong>{{gym}}</strong></td>
    </tr>
    <tr>
      <td style="background:#0a0a0b;padding:14px 24px;font-size:11px;line-height:1.5;color:#9a9aa4;">
        Este es un recordatorio automático. Si ya pagaste tu cuota, ignorá este mensaje.
      </td>
    </tr>
  </table>
</div>
